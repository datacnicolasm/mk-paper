services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      # Secrets opcionales: se leen de .env; vacío = sin auth en S2
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LITELLM_MODEL: ${LITELLM_MODEL:-groq/llama-3.3-70b-versatile}
      LITELLM_FAST_MODEL: ${LITELLM_FAST_MODEL:-groq/llama-3.1-8b-instant}
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - mk-paper-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mkpaper
      POSTGRES_USER: mkpaper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mkpaper}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkpaper -d mkpaper"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mk-paper-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - mk-paper-net

volumes:
  postgres_data:
  minio_data:

networks:
  mk-paper-net:
