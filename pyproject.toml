[project]
name = "mk-paper"
version = "0.1.0"
description = "Sistema multi-agente científico con CrewAI"
requires-python = ">=3.12"
dependencies = [
    "crewai",
    "litellm",
    "pandas",
    "numpy",
    "statsmodels",
    "scikit-learn",
    "boto3",
    "psycopg[binary]",
    "python-dotenv",
    "pydantic-settings",
    "httpx",
]

[project.scripts]
mk-paper = "mk_paper.main:main"
mk-paper-cli = "mk_paper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
